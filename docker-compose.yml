services:
  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    restart: unless-stopped
    network_mode: host
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: 3
    volumes:
      - telegram-bot-data:/app/data

volumes:
  telegram-bot-data:
